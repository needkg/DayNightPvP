# Worlds configurations

world:
  pvp:
    day-end: 12900
    auto:
      enabled: true
    keep-on-death:
      inventory:
        enabled: true
        when: night #(day|night|all)
      exp:
        enabled: true
        when: night #(day|night|all)
        lose-percent:
          default: 30
          groups:
            another-permission: 40 # dnp.lose-exp-percent.another-permission
            another-another-permission: 20 # dnp.lose-exp-percent.another-another-permission
  notifications:
    title:
      enabled: true
    sound:
      enabled: true
    chat:
      enabled: true
  integrations:
    vault:
      enabled: true


exp:
  enabled: true
  lose-percent: 
    groups: 
      default: 30 # dnp.lose-xp-percent.default
      admin: 40 # dnp.lose-xp-percent.admin


exp:
  enabled: true
  lose-percent:
    permissions:
      dnp.lose-xp-percent.default: 30
      dnp.lose-xp-percent.admin: 40


